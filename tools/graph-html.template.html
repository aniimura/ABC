<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>IUT 依存グラフ — Corollary 3.12 の推移閉包</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f5f7;overflow:hidden;font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:#222}
canvas{display:block;cursor:grab}canvas.dragging{cursor:grabbing}
#sb{position:fixed;top:0;left:0;width:320px;height:100vh;background:#fff;box-shadow:2px 0 14px rgba(0,0,0,.13);z-index:50;display:flex;flex-direction:column;transition:transform .22s}
#sb.hid{transform:translateX(-320px)}
#tg{position:fixed;top:10px;left:10px;z-index:60;width:32px;height:32px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:15px;color:#555;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:left .22s}
#tg.op{left:330px}
.hd{padding:12px 16px;border-bottom:1px solid #e6e6e6;flex-shrink:0}
.hd h1{font-size:14px;margin-bottom:3px}
.hd p{font-size:11px;color:#777;line-height:1.5}
.bd{overflow-y:auto;padding:12px 16px;flex:1}
.sec{margin-bottom:16px}
.sec h2{font-size:11px;color:#888;letter-spacing:.06em;margin-bottom:7px;text-transform:uppercase}
.st{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dotted #eee}
.st b{font-variant-numeric:tabular-nums}
.lg{display:flex;align-items:center;gap:7px;font-size:12px;padding:2px 0;cursor:pointer;user-select:none}
.lg.off{opacity:.32}
.sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.warn{background:#fff8e1;border-left:3px solid #f0b429;padding:8px 10px;font-size:11px;line-height:1.6;color:#5a4300;margin-bottom:14px}
#q{width:100%;padding:6px 8px;border:1px solid #ddd;border-radius:5px;font-size:12px}
#det{position:fixed;right:12px;top:12px;width:330px;background:#fff;border-radius:8px;box-shadow:0 3px 18px rgba(0,0,0,.16);padding:13px 15px;font-size:12px;z-index:55;display:none;line-height:1.65}
#det h3{font-size:13px;margin-bottom:6px}
#det .row{display:flex;gap:8px;padding:2px 0}
#det .row span:first-child{color:#888;min-width:74px;flex-shrink:0}
#det code{background:#f2f2f4;padding:1px 4px;border-radius:3px;font-size:11px;word-break:break-all}
#det .cl{position:absolute;right:9px;top:7px;cursor:pointer;color:#aaa;font-size:15px}
#hint{position:fixed;bottom:10px;right:12px;font-size:11px;color:#8a8a8a;background:rgba(255,255,255,.86);padding:5px 9px;border-radius:5px;z-index:40}
</style></head><body>
<button id="tg" class="op">☰</button>
<div id="sb">
  <div class="hd">
    <h1>IUT 依存グラフ</h1>
    <p>根: <b>[IUTchIII] Corollary 3.12</b><br>原文の参照から機械抽出した推移閉包に、<b>我々が張った節点</b>を重ねたもの</p>
  </div>
  <div class="bd">
    <div class="warn"><b>★分母は下界でも上界でもない。</b>
      <code>pdftotext</code> 由来で目視していない。番号の無い依存を数え落とし、
      「the discussion of …」型の<b>案内</b>を依存として数え過ぎる。
      <b>桁を見るためだけに使うこと。</b></div>
    <div class="sec"><h2>規模</h2><div id="stats"></div></div>
    <div class="sec"><h2>我々の位置</h2><div id="cov"></div></div>
    <div class="sec"><h2>検索</h2><input id="q" placeholder="Theorem 3.11 / FrdI …"></div>
    <div class="sec"><h2>論文(クリックで表示切替)</h2><div id="leg"></div></div>
  </div>
</div>
<canvas id="cv"></canvas>
<div id="det"><span class="cl">×</span><div id="detb"></div></div>
<div id="hint">ドラッグ=移動 / ホイール=拡大 / 節点クリック=詳細</div>
<script>
const D = /*__DATA__*/;
const N = D.N, E = D.E, S = D.stats;
// 論文ごとの色(決定的)
const PAL=['#2f6fd0','#d0492f','#2f9e6b','#a05fd0','#d09a2f','#2fa8c0','#c02f7a','#6b8f2f','#8f5a2f','#5a2f8f','#2f8f7a','#8f2f5a'];
const color=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length];};
const tagOn=new Map(D.tags.map(t=>[t,true]));

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let vx=0,vy=0,sc=.55,drag=false,lx=0,ly=0,hover=null,sel=null,query='';
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw();}
addEventListener('resize',fit);

const vis=i=>tagOn.get(N[i].t)!==false;
const hit=n=>query&&(n.t+' '+n.n).toLowerCase().includes(query);

function draw(){
  ctx.save();ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.fillStyle='#f4f5f7';ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.translate(innerWidth/2+vx,innerHeight/2+vy);ctx.scale(sc,sc);
  // 辺
  ctx.lineWidth=.6;
  for(const [a,b] of E){
    if(!vis(a)||!vis(b))continue;
    const A=N[a],B=N[b];
    const on=sel!==null&&(a===sel||b===sel);
    ctx.strokeStyle=on?'rgba(20,20,20,.55)':'rgba(120,125,135,.13)';
    ctx.lineWidth=on?1.6:.6;
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
  }
  // 節点
  for(let i=0;i<N.length;i++){
    const n=N[i];if(!vis(i))continue;
    const r=n.o?7:(n.e?3:4.2);
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.284);
    ctx.fillStyle=n.e?'#b9bcc4':color(n.t);
    if(query&&!hit(n))ctx.globalAlpha=.13;
    ctx.fill();ctx.globalAlpha=1;
    if(n.o){ctx.lineWidth=2.4;ctx.strokeStyle=n.o==='found'?'#111':'#fff';ctx.stroke();}
    if(i===sel||i===hover){ctx.lineWidth=2;ctx.strokeStyle='#111';ctx.beginPath();ctx.arc(n.x,n.y,r+3.5,0,6.284);ctx.stroke();}
  }
  // ラベル(拡大時 / 我々の節点は常時)
  ctx.font='11px -apple-system,Segoe UI,sans-serif';ctx.textAlign='center';
  for(let i=0;i<N.length;i++){
    const n=N[i];if(!vis(i))continue;
    if(!(n.o||sc>1.35||i===hover||i===sel||(query&&hit(n))))continue;
    const s=n.t+' '+n.n;const w=ctx.measureText(s).width;
    ctx.fillStyle='rgba(255,255,255,.86)';ctx.fillRect(n.x-w/2-3,n.y-21,w+6,14);
    ctx.fillStyle='#222';ctx.fillText(s,n.x,n.y-10);
  }
  ctx.restore();
}
function pick(mx,my){
  const x=(mx-innerWidth/2-vx)/sc,y=(my-innerHeight/2-vy)/sc;
  let best=null,bd=1e9;
  for(let i=0;i<N.length;i++){if(!vis(i))continue;const n=N[i];const d=(n.x-x)**2+(n.y-y)**2;if(d<bd){bd=d;best=i;}}
  return bd<(14/sc)**2?best:null;
}
cv.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.classList.add('dragging');});
addEventListener('mouseup',()=>{drag=false;cv.classList.remove('dragging');});
cv.addEventListener('mousemove',e=>{
  if(drag){vx+=e.clientX-lx;vy+=e.clientY-ly;lx=e.clientX;ly=e.clientY;draw();return;}
  const h=pick(e.clientX,e.clientY);if(h!==hover){hover=h;draw();}
});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;
  const mx=e.clientX-innerWidth/2-vx,my=e.clientY-innerHeight/2-vy;
  vx-=mx*(f-1);vy-=my*(f-1);sc=Math.max(.12,Math.min(6,sc*f));draw();},{passive:false});
cv.addEventListener('click',e=>{
  const h=pick(e.clientX,e.clientY);sel=h;
  const d=document.getElementById('det');
  if(h===null){d.style.display='none';draw();return;}
  const n=N[h];
  const outs=E.filter(([a])=>a===h).map(([,b])=>N[b]);
  const ins=E.filter(([,b])=>b===h).map(([a])=>N[a]);
  document.getElementById('detb').innerHTML=
    `<h3>[${n.t}] ${n.n}</h3>`+
    `<div class="row"><span>物理ページ</span><span>${n.p||'—'}</span></div>`+
    `<div class="row"><span>根からの深さ</span><span>${n.d}</span></div>`+
    `<div class="row"><span>出→ / ←入</span><span>${outs.length} / ${ins.length}</span></div>`+
    (n.o?`<div class="row"><span>我々の側</span><span><b>${n.o}</b></span></div>`+
         `<div class="row"><span>ファイル</span><span><code>${n.f}</code></span></div>`
        :`<div class="row"><span>我々の側</span><span style="color:#b04">未着手</span></div>`)+
    (n.it?`<div class="row"><span>典拠の項目</span><span>${n.it}</span></div>`:'')+
    (n.e?`<div class="row"><span>注</span><span>0_Source に無い外部文献</span></div>`:'')+
    `<div class="row" style="margin-top:6px"><span>依存先</span><span>${outs.slice(0,12).map(o=>`[${o.t}] ${o.n}`).join('、')||'—'}${outs.length>12?` ほか ${outs.length-12}`:''}</span></div>`;
  d.style.display='block';draw();
});
document.querySelector('#det .cl').onclick=()=>{document.getElementById('det').style.display='none';sel=null;draw();};
document.getElementById('tg').onclick=function(){document.getElementById('sb').classList.toggle('hid');this.classList.toggle('op');};
document.getElementById('q').oninput=e=>{query=e.target.value.trim().toLowerCase();draw();};

// サイドバー
const cnt=new Map();for(const n of N)cnt.set(n.t,(cnt.get(n.t)||0)+1);
const oursByTag=new Map();for(const n of N)if(n.o)oursByTag.set(n.t,(oursByTag.get(n.t)||0)+1);
document.getElementById('stats').innerHTML=
  `<div class="st"><span>節点</span><b>${S.nodes}</b></div>`+
  `<div class="st"><span>辺</span><b>${S.edges}</b></div>`+
  `<div class="st"><span>最大深さ</span><b>${S.maxDepth}</b></div>`+
  `<div class="st"><span>論文</span><b>${S.papers}</b></div>`+
  `<div class="st"><span>うち外部文献の節点</span><b>${S.external}</b></div>`;
document.getElementById('cov').innerHTML=
  `<div class="st"><span>着地(実物がある)</span><b>${S.landed}</b></div>`+
  `<div class="st"><span>張った(statement を書いた)</span><b>${S.skeleton}</b></div>`+
  `<div class="st"><span>名前だけ知っている</span><b>${S.named}</b></div>`+
  `<div class="st"><span>合わせて</span><b>${S.ours} / ${S.nodes} = ${(S.ours/S.nodes*100).toFixed(1)}%</b></div>`+
  `<div class="st" style="margin-top:8px;border-top:1px solid #eee;padding-top:8px"><span>Interface の義務(構造体)</span><b>${S.obligDone} / ${S.oblig}</b></div>`+
  `<p style="font-size:11px;color:#777;margin-top:6px;line-height:1.6">
   ★<b>義務は上の被覆率に含めていない</b>——語彙が違う(原文の項目番号 対 我々の構造体)。
   凡例の <code>Interface</code> を押すと義務だけを見られる。
   ★原文の 1 項目が何本に割れているかは、その項目から出る <code>Interface</code> の辺の数で読む。</p>`+
  `<p style="font-size:11px;color:#777;margin-top:6px;line-height:1.6">
   白縁=張った節点、黒縁=<code>Found/</code> に着地。灰色の小点は <code>0_Source</code> に無い外部文献。
   ★この率は<b>張れば上がる</b>——下げる方向の操作は無い。</p>
  <p style="font-size:11px;color:#777;margin-top:8px;line-height:1.6">
   ★<b><code>check.mjs</code> の被覆率(4.1%)とは分母が違う。</b>
   あちらは根が定理・命題の4論文ぶん(244)、こちらは <b>Corollary 3.12</b> から到達する
   全番号付き項目(${S.nodes}、略号の写像が未確認のものと外部文献を含む)。<br>
   ★<b>番号を持たない項目はこの図に出ない。</b>
   例: <code>[AbsTopIII] (L1)</code>(log-shell のコンパクト性、我々が唯一着地させたもの)は
   序論のラベルであって番号付き項目ではないので、<b>ここには現れない</b>。
   したがって上の「着地」は 0 と出るが、実際の着地は 1 件ある。</p>`;
document.getElementById('leg').innerHTML=D.tags.map(t=>
  `<div class="lg" data-t="${t}"><span class="sw" style="background:${color(t)}"></span>
   <span style="flex:1">${t}</span><span style="color:#999">${cnt.get(t)||0}${oursByTag.get(t)?` <b style="color:#222">/${oursByTag.get(t)}</b>`:''}</span></div>`).join('');
document.querySelectorAll('.lg').forEach(el=>el.onclick=()=>{
  const t=el.dataset.t;tagOn.set(t,!tagOn.get(t));el.classList.toggle('off');draw();});
fit();
</script></body></html>
