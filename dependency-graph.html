  vx-=(e.clientX-vx)*(f-1);vy-=(e.clientY-vy)*(f-1);sc=Math.max(.08,Math.min(3,sc*f));draw();},{passive:false});
cv.addEventListener('click',e=>{
  if(moved){moved=false;return;}            // ★パンの直後は選択を変えない
  const p=pick(e.clientX,e.clientY);
  const h=(p!==null&&p===sel)?null:p;       // ★同じ節点をもう一度押したら解除
  sel=h;setHighlight(h);
  const d=document.getElementById('det');
  if(h===null){d.style.display='none';draw();return;}
  const b=B[h];
  const deps=BE.filter(([a])=>a===h).map(([,x])=>B[x]);
  const used=BE.filter(([,x])=>x===h).map(([a])=>B[a]);
  const depN=[...hlDeps].reduce((s,i)=>s+B[i].n,0), useN=[...hlUsers].reduce((s,i)=>s+B[i].n,0);
  const minL=hlDeps.size?Math.min(...[...hlDeps].map(i=>B[i].layer)):b.layer;
  document.getElementById('detb').innerHTML=
    `<h3>${b.tags.map(([t,n])=>`${t}${b.scc?` (${n})`:''}`).join(' + ')}</h3>`+
    `<div class="sub">層 ${b.layer}${b.scc?' ・ <b style="color:#c0392b">循環している塊(分割不可)</b>':''}${b.root?' ・ <b>根を含む</b>':''}</div>`+
    `<div class="row"><span>項目数</span><span><b>${b.n}</b></span></div>`+
    `<div class="row"><span>我々が触れた</span><span>${b.ours}${b.landed?`(うち着地 ${b.landed})`:''}</span></div>`+`<div class="row"><span>Lean 形式化が完了</span><span><b>${b.done||0} / ${b.n}</b>${b.n>0&&(b.done||0)>=b.n?' —— このボックスは完了':''}</span></div>`+
    `<hr style="border:0;border-top:1px solid #eee;margin:7px 0">`+
    `<div class="row"><span style="color:${C_DEP}">← これに要る</span><span><b style="color:${C_DEP}">${hlDeps.size} ボックス / ${depN} 項目</b>(直接 ${deps.length})</span></div>`+
    `<div class="row"><span style="color:${C_USE}">→ これを使う</span><span><b style="color:${C_USE}">${hlUsers.size} ボックス / ${useN} 項目</b>(直接 ${used.length})</span></div>`+
    (hlDeps.size?`<div class="row"><span>最も左の層</span><span>層 ${minL}(ここから積み上げる)</span></div>`:
                 `<div class="row"><span>依存</span><span><b style="color:${C_DEP}">無し —— 今すぐ着手できる</b></span></div>`)+
    `<ul>${b.items.map(it=>`<li${it.o==='done'?' class="dn"':''}>${it.o?`<b style="color:${it.o==='done'?'#6b7280':'#1e7a52'}">${it.o==='done'?'■':'●'}</b> `:''}${it.k.replace(' / ',' ')} <span style="color:#aaa">p.${it.p||'?'}</span></li>`).join('')}</ul>`;
  d.style.display='block';draw();
});
document.querySelector('#det .cl').onclick=()=>{document.getElementById('det').style.display='none';sel=null;setHighlight(null);draw();};
document.getElementById('tg').onclick=function(){document.getElementById('sb').classList.toggle('hid');this.classList.toggle('op');};

// ★サイドバーは「全ノード数・形式化完了数・論文一覧」だけにした(2026-09-03)。

document.getElementById('stats').innerHTML=
  `<div class="st"><span>全ノード</span><b>${S.nodes}</b></div>`+
  `<div class="st"><span>形式化 完了</span><b>${B.reduce((a,b)=>a+(b.done||0),0)}</b></div>`;

// ★★論文一覧 —— クリックでその論文の部分グラフをハイライトする。
//   ★ボックスの tags は [[出典, 節点数], …]。循環している塊は
//   複数の論文をまたぐので、**含むボックスをすべて**出す。
// ★一覧は**論文ごと**にまとめる。ボックスの名前は `FrdI §5` のように節を持つが、
//   一覧では節を落として `FrdI` にする(2026-09-03)。
const paperOf=t=>{const m=/^(.*) \u00a7[^ ]*$/.exec(t);return m?m[1]:t;};
const tagCount=new Map(), tagBoxes=new Map();
for(let i=0;i<B.length;i++){for(const [t0,n] of B[i].tags){const t=paperOf(t0);
  tagCount.set(t,(tagCount.get(t)||0)+(n||1));
  if(!tagBoxes.has(t))tagBoxes.set(t,new Set());tagBoxes.get(t).add(i);}}
const tagList=[...tagCount.entries()].sort((a,b)=>b[1]-a[1]);
const mxT=Math.max(...tagList.map(t=>t[1]));
document.getElementById('papers').innerHTML=tagList.map(([t,n])=>
  `<div class="lr" data-t="${t}"><span style="min-width:96px;overflow:hidden;text-overflow:ellipsis">
   ${t}</span>
   <span class="bar" style="width:${Math.max(3,n/mxT*90)}px;background:#9aa3ad"></span>
   <span class="n">${n}</span></div>`).join('');
function paintTags(){document.querySelectorAll('#papers .lr').forEach(el=>{
  el.style.background=(el.dataset.t===selTag)?'#eef4ff':'';
  el.style.fontWeight=(el.dataset.t===selTag)?'700':'';});}
document.querySelectorAll('#papers .lr').forEach(el=>el.onclick=()=>{
  const t=el.dataset.t;
  selTag=(selTag===t)?null:t;
  paintTags();
  // ★クリックしても表示位置は動かさない(2026-09-03)。今どこを見ていたか分からなくなるため。
  draw();});
document.getElementById("rf").onclick=e=>{e.preventDefault();fitAll();draw();};
fit();
</script></body></html>
